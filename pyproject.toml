[project]
name = "vectrify"
dynamic = ["version"]
description = "Vectorizes raster images (PNG/JPG) in a local SVG editor, with segmentation and local-search tools. Outputs editable SVG."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Rasmus Ros", email = "rasmus.s.ros@gmail.com" },
]
keywords = [
    "svg",
    "vectorization",
    "raster-to-vector",
    "hill-climbing",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "cairosvg>=2.7.0",
    "pillow>=10.0.0",
    "numpy>=2.2.6",
    "scipy>=1.11.0",
    "shapely>=2.1,<3",
    "skia-pathops>=0.9,<1",
]

[project.optional-dependencies]
vision = [
    "scikit-learn>=1.3.0",
    "torch>=2.0.0",
    "torchvision>=0.28.0",
    "transformers>=4.49.0",
]
# A native window instead of a browser tab. Linux uses pywebview's Qt backend,
# which installs from PyPI without system packages.
desktop = [
    "pywebview>=5; sys_platform != 'linux'",
    "pywebview[qt]>=5; sys_platform == 'linux'",
]
# The MCP server (vectrify-mcp), through which an agent edits a drawing.
mcp = [
    "mcp>=2.2",
]
all = [
    "vectrify[vision,desktop,mcp]",
]
dev = [
    "pytest",
    "pytest-xdist",
    "ruff",
    "pyrefly",
    "py-spy",
    "matplotlib>=3.10.8",
    # CI installs dev, and the MCP server's tests need the SDK.
    "mcp>=2.2",
]

[project.urls]
Homepage = "https://github.com/rasros/vectrify"
Repository = "https://github.com/rasros/vectrify"
Issues = "https://github.com/rasros/vectrify/issues"

[project.scripts]
vectrify = "vectrify.ui.server:main"
vectrify-ui = "vectrify.ui.server:main"
vectrify-mcp = "vectrify.mcp.server:main"

[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
fallback_version = "0.0.0+unknown"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vectrify = ["refine/*.cu", "ui/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.pyrefly]
project-includes = ["src/**/*.py", "tests/**/*.py"]
# scripts/ is not an installed package, but the round-trip tests import the
# analysis scripts directly to check they still read what storage writes.
search-path = ["src", "scripts", "."]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126" }]
torchvision = [{ index = "pytorch-cu126" }]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "A",
    "C4",
    "PT",
    "RET",
    "SIM",
    "PTH",
    "PIE",
    "ARG",
    "RUF",
    "TID",
]
ignore = []

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
# tests/ is a top-level package now, not part of vectrify, so isort would
# otherwise sort it as a third-party import.
known-first-party = ["vectrify", "tests"]
