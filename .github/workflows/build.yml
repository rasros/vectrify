name: build

on:
  push:
    branches: [ main ]
  # Every pull request, not just those targeting main: a stacked PR is based
  # on the branch below it, and filtering by base meant none of a stack ran.
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y graphviz libcairo2

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Sync dependencies
        run: uv sync --extra dev --extra graphviz --extra typst --extra vision

      - name: Lint
        run: uv run ruff check src/ tests/ scripts/

      - name: Type check
        run: uv run pyrefly check

      - name: Run tests
        run: uv run pytest -q

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            .pytest_cache/
          if-no-files-found: ignore
